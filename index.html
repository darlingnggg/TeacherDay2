<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tri Ân Thầy Cô 20/11</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="scene">
        <!-- 1 -->
        <header class="chalk-header">
            <p class="chalk-date">20/11</p>
            <h1 class="greeting">
                <span id="greeting-vi">Gửi thầy cô</span>
                <span class="greeting__en" id="greeting-en">Dear Teachers</span>
            </h1>
        </header>

        <!-- 2 -->
        <section class="stage" id="stage">
            <div class="envelope">

                <div class="envelope__back"></div>
                <div class="letter">
                    <p class="letter__title">Happy Teacher's Day</p>
                    <div class="letter__msg">
                        <p class="letter__vi" id="msg-vi"></p>
                        <p class="letter__en" id="msg-en"></p>
                        <p class="letter__sign" id="sender">Nguyễn Hoàng Thảo (22500383)</p>
                    </div>
                </div>
                <div class="envelope__front"></div>
                <div class="envelope__flap"></div>
                <img class="flower" src="assets/svg/bouquet.svg" alt="" aria-hidden="true">
                <button class="seal" id="open-btn" type="button" aria-label="Mở thiệp">
                    <span>20/11</span>
                </button>
            </div>
        </section>

        <!-- 3 -->
        <p class="hint" id="hint">Chạm vào con dấu để mở thiệp - Tap the seal to open envelope</p>
    </main>

    <script src="js/messages.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
